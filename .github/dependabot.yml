version: 2
updates:
  # Go modules — v2-go
  - package-ecosystem: gomod
    directory: /v2-go
    schedule:
      interval: weekly
      day: monday
    reviewers:
      - "@kudig/maintainers"
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "deps(go):"
    open-pull-requests-limit: 10

  # Go modules — operator
  - package-ecosystem: gomod
    directory: /v2-go/operator
    schedule:
      interval: weekly
      day: monday
    reviewers:
      - "@kudig/maintainers"
    labels:
      - dependencies
      - go
      - operator
    commit-message:
      prefix: "deps(operator):"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci:"

  # Docker
  - package-ecosystem: docker
    directory: /v2-go
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "docker:"
