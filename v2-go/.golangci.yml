# golangci-lint v2 配置文件
# 参考: https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  modules-download-mode: readonly
  concurrency: 4

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  uniq-by-line: true
  sort-results: true

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
    exclude-functions:
      - (io.Closer).Close
      - (net/http.ResponseWriter).Write

  gocyclo:
    min-complexity: 15

  lll:
    line-length: 120

  funlen:
    lines: 60
    statements: 40

  importas:
    alias:
      - pkg: k8s.io/api/core/v1
        alias: corev1
      - pkg: k8s.io/apimachinery/pkg/apis/meta/v1
        alias: metav1

  staticcheck:
    checks: ["all"]

  gofmt:
    simplify: true

  gci:
    sections:
      - standard
      - default
      - prefix(github.com/kudig)
    custom-order: true

  tagalign:
    order:
      - json
      - yaml

  govet:
    enable-all: true

  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: increment-decrement
      - name: var-naming
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unreachable-code
      - name: redefines-builtin-id

linters:
  enable:
    # 基础检查
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

    # 代码质量
    - gocyclo
    - funlen
    - lll
    - nestif
    - goconst
    - gocritic
    - godot
    - gofmt
    - gofumpt
    - goimports
    - gci
    - misspell
    - whitespace
    - wsl

    # 安全相关
    - gosec
    - bodyclose
    - noctx

    # 性能相关
    - prealloc

    # 风格相关
    - revive
    - stylecheck
    - tagalign
    - nakedret
    - nilnil
    - errorlint
    - wrapcheck
    - forcetypeassert

  disable:
    # 暂时禁用
    - varnamelen
    - exhaustruct
    - paralleltest
    - testpackage
    - gomnd

issues:
  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues: 3

  exclude-dirs:
    - vendor
    - build
    - reference
    - operator

  exclude-rules:
    # 测试文件放宽
    - path: _test\.go
      linters:
        - funlen
        - gocyclo
        - lll
        - gosec
        - wrapcheck
        - errorlint
        - forcetypeassert

    # main 包放宽
    - path: cmd/
      linters:
        - funlen
        - gocyclo
        - wrapcheck

    # 忽略特定的警告
    - text: 'Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*print(f|ln)?) is not checked'
      linters:
        - errcheck

    # 忽略 defer 中的错误检查
    - text: "defer"
      linters:
        - errcheck

  new: false
  fix: false
