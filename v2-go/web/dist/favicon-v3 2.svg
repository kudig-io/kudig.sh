<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background -->
  <rect width="100" height="100" rx="18" fill="#1e293b"/>
  
  <!-- Kubernetes-inspired helm wheel -->
  <g fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round">
    <!-- Center -->
    <circle cx="50" cy="50" r="12" fill="#3b82f6" stroke="none"/>
    
    <!-- Spokes -->
    <line x1="50" y1="20" x2="50" y2="35"/>
    <line x1="50" y1="65" x2="50" y2="80"/>
    <line x1="20" y1="50" x2="35" y2="50"/>
    <line x1="65" y1="50" x2="80" y2="50"/>
    
    <!-- Diagonal spokes -->
    <line x1="29" y1="29" x2="38" y2="38"/>
    <line x1="62" y1="62" x2="71" y2="71"/>
    <line x1="71" y1="29" x2="62" y2="38"/>
    <line x1="38" y1="62" x2="29" y2="71"/>
  </g>
  
  <!-- K overlay -->
  <text x="50" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="bold" 
        fill="white" text-anchor="middle">K</text>
</svg>
