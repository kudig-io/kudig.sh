<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="24" fill="url(#grad1)"/>
  
  <!-- Stylized K that looks like a tool/claw -->
  <g fill="white">
    <!-- Vertical stem -->
    <rect x="22" y="20" width="14" height="60" rx="3"/>
    
    <!-- Upper arm (tool handle) -->
    <path d="M36 35 L65 20 L72 28 L45 45 Z"/>
    
    <!-- Lower arm (claw) -->
    <path d="M36 55 L60 65 L65 78 L55 80 L40 70 Z"/>
    
    <!-- Accent circle (pivot point) -->
    <circle cx="40" cy="50" r="6" fill="url(#grad2)"/>
  </g>
  
  <!-- Small decorative element -->
  <circle cx="75" cy="25" r="5" fill="#60a5fa" opacity="0.8"/>
  <circle cx="75" cy="75" r="3" fill="#93c5fd" opacity="0.6"/>
</svg>
